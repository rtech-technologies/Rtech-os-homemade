[package]
name = "kernel"
version = "0.1.0"
edition = "2021"

[dependencies]
lazy_static = { version = "1.0", features = ["spin_no_std"] }
spin = "0.9.8"
volatile = "0.2.6"
x86_64 = "0.14.9"
uart_16550 = "0.2.19"
pic8259 = "0.10.1"
pc-keyboard = "0.7.0"
linked_list_allocator = "0.9.0"
xhci = "0.9.2"

[dependencies.bootloader]
version = "0.9.23"
features = ["map_physical_memory"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
